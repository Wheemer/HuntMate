name: Android build

'on':
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HuntMate
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: gradle --stacktrace test

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Check APKs
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f small-game-record/build/outputs/apk/debug/small-game-record-debug.apk

      - name: Upload HuntMate APK
        uses: actions/upload-artifact@v4
        with:
          name: huntmate-hunting-fishing-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload standalone Small Game Record APK
        uses: actions/upload-artifact@v4
        with:
          name: small-game-record-debug-apk
          path: small-game-record/build/outputs/apk/debug/small-game-record-debug.apk
          if-no-files-found: error
