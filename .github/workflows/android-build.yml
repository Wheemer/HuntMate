name: Android build

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUNTMATE_KEYSTORE_FILE: /tmp/huntmate-signing.jks
      HUNTMATE_KEYSTORE_PASSWORD: ${{ secrets.HUNTMATE_KEYSTORE_PASSWORD }}
      HUNTMATE_KEY_ALIAS: ${{ secrets.HUNTMATE_KEY_ALIAS }}
      HUNTMATE_KEY_PASSWORD: ${{ secrets.HUNTMATE_KEY_PASSWORD }}
    steps:
      - name: Checkout HuntMate
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;36.0.0"

      - name: Restore persistent APK signing key
        if: ${{ env.HUNTMATE_KEYSTORE_PASSWORD != '' && env.HUNTMATE_KEY_ALIAS != '' && env.HUNTMATE_KEY_PASSWORD != '' }}
        env:
          HUNTMATE_KEYSTORE_BASE64: ${{ secrets.HUNTMATE_KEYSTORE_BASE64 }}
        run: |
          test -n "$HUNTMATE_KEYSTORE_BASE64"
          printf '%s' "$HUNTMATE_KEYSTORE_BASE64" | base64 --decode > "$HUNTMATE_KEYSTORE_FILE"

      - name: Resolve Android app dependencies
        run: |
          set -euo pipefail
          if ! gradle --stacktrace :app:dependencies --configuration debugCompileClasspath > dependency-compile.txt 2>&1; then
            cat dependency-compile.txt
            exit 1
          fi
          if ! gradle --stacktrace :app:dependencies --configuration debugRuntimeClasspath > dependency-runtime.txt 2>&1; then
            cat dependency-runtime.txt
            exit 1
          fi
          echo "Android compile and runtime dependencies resolved successfully."

      - name: Run unit tests
        run: gradle --stacktrace test

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Check APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature and 16 KB alignment
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huntmate-hunting-fishing-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-build-${GITHUB_RUN_NUMBER}" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "HuntMate APK build ${GITHUB_RUN_NUMBER}" \
            --notes "Automated APK build from ${GITHUB_SHA}." \
            --prerelease \
            app/build/outputs/apk/debug/app-debug.apk
