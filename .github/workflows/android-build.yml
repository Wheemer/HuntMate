name: Android build

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HuntMate
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: huntmate-debug-signing-key-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Repair invalid hdpi launcher PNG for Android resource compiler
        shell: bash
        run: |
          set -euo pipefail
          # The hdpi launcher asset currently fails AAPT2 compilation. Reuse the
          # validated mdpi PNG so CI can build an installable test APK.
          test -s app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp app/src/main/res/mipmap-mdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Run clean unit tests
        run: gradle --no-daemon --stacktrace clean test

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK archive, package metadata, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee /tmp/huntmate-badging.txt
          grep -q "package: name='com.huntmate.gps'" /tmp/huntmate-badging.txt
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          echo "APK_SIZE_BYTES=$(stat -c%s "$APK")" >> "$GITHUB_ENV"
          sha256sum "$APK" | tee app-debug.sha256
          cat /tmp/huntmate-badging.txt

      - name: Upload verified APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: huntmate-hunting-fishing-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.sha256
          if-no-files-found: error
