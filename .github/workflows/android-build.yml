name: Android build

'on':
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUNTMATE_KEYSTORE_FILE: /tmp/huntmate-signing.jks
      HUNTMATE_KEYSTORE_PASSWORD: ${{ secrets.HUNTMATE_KEYSTORE_PASSWORD }}
      HUNTMATE_KEY_ALIAS: ${{ secrets.HUNTMATE_KEY_ALIAS }}
      HUNTMATE_KEY_PASSWORD: ${{ secrets.HUNTMATE_KEY_PASSWORD }}
    steps:
      - name: Checkout HuntMate
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Restore persistent APK signing key
        if: ${{ env.HUNTMATE_KEYSTORE_PASSWORD != '' && env.HUNTMATE_KEY_ALIAS != '' && env.HUNTMATE_KEY_PASSWORD != '' }}
        env:
          HUNTMATE_KEYSTORE_BASE64: ${{ secrets.HUNTMATE_KEYSTORE_BASE64 }}
        run: |
          test -n "$HUNTMATE_KEYSTORE_BASE64"
          printf '%s' "$HUNTMATE_KEYSTORE_BASE64" | base64 --decode > "$HUNTMATE_KEYSTORE_FILE"

      - name: Run unit tests
        run: gradle --stacktrace test

      - name: Build debug APK
        run: gradle --stacktrace assembleDebug

      - name: Check APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huntmate-hunting-fishing-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
